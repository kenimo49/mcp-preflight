[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-preflight"
version = "0.1.0"
description = "Pre-flight checks for MCP servers: passive token footprint, use-case scoping, security, and name safety. LLM-facing quality scorecard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ken Imoto" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "audit", "security", "token", "llm", "pre-flight"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "tiktoken>=0.7",
    "Levenshtein>=0.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/kenimo49/mcp-preflight"
Repository = "https://github.com/kenimo49/mcp-preflight"
Issues = "https://github.com/kenimo49/mcp-preflight/issues"
Funding = "https://github.com/sponsors/kenimo49"

[project.scripts]
mcp-preflight = "mcp_preflight.cli:main"
mpf = "mcp_preflight.cli:main"
mcp-preflight-mcp = "mcp_preflight.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_preflight"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcp_preflight/data" = "mcp_preflight/data"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
